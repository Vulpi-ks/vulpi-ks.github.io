  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}

  @media (max-width:360px){h1{font-size:23px}.ic{width:40px;height:40px;font-size:20px}.tx b{font-size:15.5px}}
  a.l{padding:12px 14px;border-radius:999px;position:relative;justify-content:center}

  a.l .tx{flex:none;text-align:center}

</style>
